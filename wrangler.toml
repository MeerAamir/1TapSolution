# Cloudflare Pages project configuration (used by `wrangler pages` commands
# and read by Pages for Git-connected builds).
name = "1tap-solution"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Non-secret variables can live here. Secrets (EDGE_INGEST_SECRET,
# VISITOR_HASH_SECRET) must be set in the dashboard or with
# `wrangler pages secret put NAME`.
# [vars]
# SUPABASE_URL = "https://your-project-ref.supabase.co"
